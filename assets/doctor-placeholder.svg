<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF" />
      <stop offset="50%" stop-color="#E1EFFF" />
      <stop offset="100%" stop-color="#CCE3FD" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0082FA" />
      <stop offset="100%" stop-color="#0755B8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0082FA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0082FA" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0755B8" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="600" height="700" rx="32" fill="url(#bgGrad)" />
  <rect width="600" height="700" rx="32" fill="url(#glow)" />
  
  <!-- Subtle decorative medical grid & circles -->
  <circle cx="500" cy="120" r="180" stroke="#0082FA" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25" />
  <circle cx="100" cy="550" r="140" stroke="#0755B8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2" />

  <!-- Center Doctor Figure Silhouette (Professional, Elegant Pharmacist/Lecturer) -->
  <g filter="url(#shadow)">
    <!-- Lab coat / Suit body -->
    <path d="M160 620 C160 480 210 440 300 440 C390 440 440 480 440 620 L440 640 C440 655 425 665 410 665 L190 665 C175 665 160 655 160 640 Z" fill="#FFFFFF" />
    <!-- Coat lapels -->
    <path d="M250 440 L300 560 L240 665" stroke="#E5E7EB" stroke-width="3" fill="none" />
    <path d="M350 440 L300 560 L360 665" stroke="#E5E7EB" stroke-width="3" fill="none" />
    <!-- Shirt / Tie in blue -->
    <path d="M285 450 L315 450 L308 530 L300 545 L292 530 Z" fill="url(#primaryGrad)" />
    
    <!-- Neck -->
    <path d="M270 370 L330 370 L325 450 L275 450 Z" fill="#E2E8F0" />
    
    <!-- Head / Hair -->
    <ellipse cx="300" cy="300" rx="75" ry="90" fill="#E2E8F0" />
    <path d="M225 280 C225 210 260 190 300 190 C340 190 375 210 375 280 C370 240 340 220 300 220 C260 220 230 240 225 280 Z" fill="#0755B8" opacity="0.85" />
    
    <!-- Stethoscope stylized -->
    <path d="M260 450 C260 520 280 570 300 580 C320 570 340 520 340 450" stroke="#0082FA" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="300" cy="590" r="14" fill="#0755B8" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Informative badge overlay at bottom -->
  <g transform="translate(60, 520)">
    <rect width="480" height="130" rx="20" fill="#FFFFFF" fill-opacity="0.95" filter="url(#shadow)" stroke="#E5E7EB" stroke-width="1.5" />
    <circle cx="60" cy="65" r="28" fill="url(#primaryGrad)" />
    <text x="60" y="73" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Rx</text>
    
    <text x="110" y="55" font-family="'Alexandria', sans-serif" font-size="22" font-weight="700" fill="#0755B8">د. عمر هاشم</text>
    <text x="110" y="85" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="15" font-weight="500" fill="#64748B">صيدلي ومحاضر • مؤسس The One Percent</text>
    <text x="110" y="108" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="400" fill="#0082FA">صورة مخصصة سيتم استبدالها بصورة الدكتور الفوتوغرافية</text>
  </g>
</svg>
